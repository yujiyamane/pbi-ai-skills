name: Sync sub-repos

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - pbi-drafter
          - pbi-deployer
          - pbi-drafter-configurator
          - pbi-tester
          - pbi-user-guide-drafter

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push ${{ matrix.repo }} to its own repo
        env:
          PAT: ${{ secrets.SYNC_PAT }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)

          cd ${{ matrix.repo }}

          git init
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote add origin https://x-access-token:${PAT}@github.com/yujiyamane/${{ matrix.repo }}.git
          git add -A
          git commit -m "sync from pbi-ai-skills@${SHORT_SHA}" --allow-empty
          git push -f origin HEAD:master
